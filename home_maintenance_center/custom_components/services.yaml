mark_completed:
  name: Segna manutenzione come eseguita
  description: Aggiorna la data dell'ultima manutenzione e ricalcola automaticamente la prossima scadenza.
  fields:
    item_id:
      name: ID manutenzione
      description: Identificativo univoco dell'elemento di manutenzione.
      required: true
      selector:
        text:

add_item:
  name: Aggiungi manutenzione
  description: Crea un nuovo elemento di manutenzione.
  fields:
    name:
      name: Nome
      required: true
      selector:
        text:

    category:
      name: Categoria
      required: false
      selector:
        text:

    interval_days:
      name: Intervallo (giorni)
      required: true
      default: 180
      selector:
        number:
          min: 1
          max: 3650
          mode: box

remove_item:
  name: Elimina manutenzione
  description: Elimina definitivamente un elemento di manutenzione.
  fields:
    item_id:
      name: ID manutenzione
      required: true
      selector:
        text:

postpone_item:
  name: Posticipa manutenzione
  description: Posticipa la prossima manutenzione di un numero di giorni.
  fields:
    item_id:
      name: ID manutenzione
      required: true
      selector:
        text:

    days:
      name: Giorni
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box

reset_item:
  name: Ripristina manutenzione
  description: Ripristina la data di manutenzione e il relativo intervallo.
  fields:
    item_id:
      name: ID manutenzione
      required: true
      selector:
        text:

reload:
  name: Ricarica integrazione
  description: Ricarica i dati dal database dell'integrazione.